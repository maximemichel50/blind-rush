<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff5b35">
<title>Blind Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: gig poster energy, loud but clean
   IDEA: a vinyl on a turntable — the record spins while you guess
   PICTURE: big vinyl with a hidden (blurred) cover as its label, ring timer around it
   COLOUR and TYPE: tomato red field, deep vinyl brown, warm yellow accent; Anton + Archivo
   LAYOUT: one centred column — bar, setup steps / turntable, four answers */
:root{color-scheme:light;--bg:#ff5b35;--ink:#1d0c07;--card:#fff4ea;--cardInk:#1d0c07;--acc:#ffd23f;--vin:#1d0c07;--vinInk:#fff1e6;--pat:none;--muted:color-mix(in srgb,var(--ink) 72%,var(--bg));--cmuted:color-mix(in srgb,var(--cardInk) 66%,var(--card));--vmuted:color-mix(in srgb,var(--vinInk) 68%,var(--vin));--ok:#1f9d55;--ko:#c81e1e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--pat),var(--bg);background-attachment:fixed;transition:background-color .5s,color .5s;color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,16px) 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font:400 30px/1 Anton,Impact,sans-serif;display:flex;align-items:center;gap:10px}
.eq{display:flex;gap:3px;align-items:flex-end;height:24px}.eq i{width:5px;background:var(--ink);border-radius:2px;height:40%;animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{to{height:100%}}
.hud{display:flex;gap:18px;font-weight:800;font-variant-numeric:tabular-nums}.hud span{white-space:nowrap}
.hud small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
h1{font:400 clamp(48px,10vw,96px)/.95 Anton,Impact,sans-serif;margin:24px 0 8px;text-wrap:balance}
.lead{font-size:18px;max-width:34em;margin:0 0 8px}
.dbinfo{font-size:14px;color:var(--muted);margin:0 0 18px}
h2{font:800 17px/1.2 Archivo,sans-serif;margin:24px 0 10px}
.tabs{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;font-weight:800;min-height:44px;color:var(--cardInk);background:transparent}
.tab[aria-selected=true]{background:var(--vin);color:var(--vinInk)}
.panel{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--cb,var(--card));color:var(--ci,var(--cardInk));padding:10px 16px;border-radius:999px;font-weight:600;min-height:44px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ci,var(--cardInk)) 25%,transparent);transition:transform .1s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink);font-weight:800}
.chip small{opacity:.7;font-weight:600;margin-left:4px}
.searchbox{position:relative}
.searchbox input{width:100%;font:inherit;font-size:16px;padding:13px 16px;border-radius:12px;border:0;background:var(--card);color:var(--cardInk);min-height:50px}
.list{list-style:none;margin:8px 0 0;padding:6px;background:var(--card);color:var(--cardInk);border-radius:12px;max-height:290px;overflow-y:auto}
.list li button{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:8px;min-height:44px;background:transparent;color:var(--cardInk)}
.list li button:hover,.list li button:focus-visible{background:color-mix(in srgb,var(--acc) 40%,transparent)}
.list li button span{font-size:14px;color:var(--cmuted);white-space:nowrap}
.list li button.on{font-weight:800}.list li button.on span::before{content:"✓ ajouté · "}
.list .none{padding:10px 12px;color:var(--cmuted)}
.sel{margin-top:14px;background:var(--vin);color:var(--vinInk);border-radius:16px;padding:14px}
.sel h3{margin:0 0 8px;font:800 16px Archivo,sans-serif;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sel h3 span{font-weight:600;color:var(--vmuted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.tag{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--vinInk) 14%,var(--vin));color:var(--vinInk);border-radius:999px;padding:6px 6px 6px 12px;font-weight:600}
.tag button{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--vinInk) 26%,var(--vin));color:var(--vinInk);font-weight:800;line-height:1}
.tags .empty{color:var(--vmuted);font-size:15px;padding:6px 0}
.selrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.ok{color:var(--acc);font-weight:800}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.diff{background:var(--card);color:var(--cardInk);border-radius:16px;padding:14px;text-align:left;min-height:96px}
.diff b{display:block;font:400 24px/1.1 Anton,sans-serif}.diff span{font-size:14px;color:var(--cmuted)}
.diff[aria-pressed=true]{background:var(--vin);color:var(--vinInk);box-shadow:inset 0 0 0 3px var(--acc)}.diff[aria-pressed=true] span{color:var(--vmuted)}
.launch{margin-top:26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.go{background:var(--acc);color:var(--goInk,#1d0c07);font:400 30px/1 Anton,sans-serif;padding:18px 40px;border-radius:16px;box-shadow:0 6px 0 var(--vin);transition:transform .1s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--vin)}
.summary{font-weight:800;max-width:24em}
.summary small{display:block;font-weight:600;color:var(--muted)}
.rules{font-size:14px;color:var(--muted);margin-top:18px;max-width:40em}
.err{background:var(--card);color:var(--cardInk);padding:14px 16px;border-radius:12px;margin-top:14px;font-weight:600;border-left:6px solid var(--ko)}
/* turntable */
.stage{display:grid;place-items:center;margin:22px 0 8px}
.deck{position:relative;width:min(300px,72vw);aspect-ratio:1}
.ring{position:absolute;inset:-14px;width:calc(100% + 28px);height:calc(100% + 28px);transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}.ring .bg{stroke:color-mix(in srgb,var(--ink) 18%,transparent)}.ring .fg{stroke:var(--acc);stroke-linecap:round;transition:stroke .2s}
.vinyl{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#2a130b 0 2px,#1a0a05 2px 4px);box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 0 0 3px #000;display:grid;place-items:center;overflow:hidden}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 40deg,rgba(255,255,255,.12) 60deg,transparent 80deg 220deg,rgba(255,255,255,.08) 240deg,transparent 260deg)}
.spin{animation:spin 1.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.label{width:44%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--acc);position:relative;z-index:1;box-shadow:0 0 0 4px #000}
.label img{width:100%;height:100%;object-fit:cover;filter:blur(16px) saturate(1.4);transform:scale(1.3);transition:filter .5s,transform .5s}
.label.show img{filter:none;transform:none}
.label::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px #000}
.status{text-align:center;font-weight:800;font-size:18px;min-height:56px;margin:14px 0 6px}
.status small{display:block;font-weight:600;font-size:15px;color:var(--muted)}
.pop{color:var(--acc);text-shadow:0 2px 0 var(--vin)}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ans{color:var(--cardInk);display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;min-height:72px;transition:transform .08s,background .2s}
.ans:not(:disabled):hover{transform:translateY(-2px)}
.ans:disabled{cursor:default}
.ans .k{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--vin);color:var(--kc,var(--acc));font:400 18px Anton,sans-serif}
.ans b{display:block;line-height:1.25}.ans span{font-size:14px;color:var(--cmuted)}
.ans.right{background:var(--ok);color:#fff}.ans.wrong{background:var(--ko);color:#fff}.ans.right span,.ans.wrong span{color:#fff}
.ans.dim{opacity:.45}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{background:var(--vin);color:var(--vinInk);padding:13px 22px;border-radius:12px;font-weight:800;min-height:48px}
.btn.alt{background:transparent;box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.btn.y{background:var(--acc);color:var(--goInk,#1d0c07)}
.btn.ghost{background:transparent;color:var(--vinInk);box-shadow:inset 0 0 0 2px var(--vmuted)}
.hide{display:none!important}
/* results */
.big{font:400 clamp(64px,16vw,120px)/1 Anton,sans-serif;margin:18px 0 0}
.recap{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:8px}
.recap li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);color:var(--cardInk);border-radius:12px;padding:8px 12px 8px 8px}
.recap img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--acc)}
.recap b{display:block;line-height:1.25}.recap span{font-size:14px;color:var(--cmuted)}
.recap a{color:inherit;font-size:13px}
.recap .p{font:400 22px Anton,sans-serif;text-align:right;white-space:nowrap}.recap .p small{display:block;font:600 13px Archivo,sans-serif;color:var(--cmuted)}
.recap li.no .p{color:var(--ko)}
.bgword{position:fixed;right:-2vw;bottom:-4vw;font:400 clamp(120px,26vw,340px)/.8 Anton,Impact,sans-serif;color:var(--ink);opacity:.07;pointer-events:none;white-space:nowrap;z-index:0;transition:opacity .4s}
.wrap{position:relative;z-index:1}
.mood{display:inline-block;margin:0 0 16px;font-weight:800;font-size:14px;background:var(--vin);color:var(--vinInk);padding:6px 12px;border-radius:999px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{background:var(--cp),var(--cb);color:var(--ci);border-radius:16px;padding:16px;text-align:left;min-height:112px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ci) 20%,transparent);transition:transform .1s}
.mode:hover{transform:translateY(-2px)}.mode b{display:block;font:400 28px/1.05 Anton,sans-serif;margin-bottom:6px}.mode span{font-size:14px;opacity:.85}
.mode[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.setup{margin-top:12px;background:var(--card);color:var(--cardInk);border-radius:16px;padding:14px;display:grid;gap:10px}
#setDuel{grid-template-columns:repeat(2,minmax(0,1fr))}
.setup label{font-weight:800;font-size:14px;display:grid;gap:6px}
.setup input:not([type=checkbox]){font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:2px solid color-mix(in srgb,var(--cardInk) 20%,transparent);background:transparent;color:var(--cardInk);min-height:46px;width:100%}
#setDuel label:first-child{color:#e63946}#setDuel label:last-child{color:#4f86ff}
.prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.prow>input{flex:1 1 200px}
.pcount,.lbl{font-weight:800;font-size:14px;color:var(--cmuted)}
#setup .tag{background:var(--vin);color:var(--vinInk)}#setup .tags .empty{color:var(--cmuted)}
.seg{display:inline-flex;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--vin)}.seg button{background:transparent;padding:10px 16px;font-weight:800;min-height:44px;color:var(--cardInk)}.seg button[aria-pressed=true]{background:var(--vin);color:var(--vinInk)}
.tog span{flex:1}.tog{flex:1 1 300px;justify-content:flex-start;display:flex!important;grid-auto-flow:column;align-items:center;gap:8px!important;font-weight:600!important}.tog input{width:20px;height:20px}
.warn{margin:0;font-size:14px;color:var(--cmuted)}
.turn{margin-top:18px;background:var(--vin);color:var(--vinInk);border-radius:16px;padding:12px 16px;text-align:center}
.turn b{display:block;font:400 28px/1.1 Anton,sans-serif}.turn span{font-size:15px;color:var(--vmuted)}
.pads.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pads.two .answers{grid-template-columns:minmax(0,1fr)}
.pad h4{margin:0 0 8px;font:400 24px/1 Anton,sans-serif;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.pad h4 small{font:600 13px Archivo,sans-serif;opacity:.75}
.pads.two .pad{padding:10px;border-radius:16px;background:color-mix(in srgb,var(--pcol) 22%,transparent);box-shadow:inset 0 0 0 2px var(--pcol)}
.pc0{--pcol:#e63946}.pc1{--pcol:#2f6bff}.pad h4{color:var(--ink)}.pad h4::before{content:'';display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--pcol);margin-right:8px;vertical-align:2px}.pad h4 span{flex:1}
:root .pads.two .pad.pc0 .k{background:#e63946;color:#fff}:root .pads.two .pad.pc1 .k{background:#2f6bff;color:#fff}
.ans.locked{box-shadow:inset 0 0 0 3px var(--pcol,var(--acc));opacity:.85}
.hud .pc0 small{color:#ff6b75}.hud .pc1 small{color:#7ba3ff}
.duelres{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font:400 28px Anton,sans-serif}.duelres .pc0{color:#ff6b75}.duelres .pc1{color:#7ba3ff}
.sentence{background:var(--card);color:var(--cardInk);border-radius:14px;padding:10px 14px;margin:6px auto 0;max-width:520px;display:grid;gap:6px;font-size:17px}
.sentence div{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;color:var(--cardInk);box-shadow:inset 0 0 0 2px var(--cmuted)}
.givebox{margin:10px auto 0;max-width:620px;text-align:center}.givebox p{margin:0 0 8px;font-weight:600}.givebox .chips{justify-content:center}
.board{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px;counter-reset:b}
.board li{counter-increment:b;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--card);color:var(--cardInk);border-radius:14px;padding:12px 16px}
.board li::before{content:counter(b);grid-row:span 2;font:400 30px Anton,sans-serif;color:var(--cmuted)}
.board b{font-size:18px}.board span{grid-column:2;font-size:14px;color:var(--cmuted)}.board em{grid-column:3;grid-row:1/span 2;font:400 26px Anton,sans-serif;font-style:normal;white-space:nowrap}
.board li.pc0{box-shadow:inset 6px 0 0 #e63946}.board li.pc1{box-shadow:inset 6px 0 0 #2f6bff}
.recap .p.duo{display:flex;gap:10px}.recap .p.duo i{font-style:normal}.recap .p.duo .pc0{color:#e63946}.recap .p.duo .pc1{color:#2f6bff}
.recap .p.small{font:600 14px Archivo,sans-serif;max-width:12em;white-space:normal}
@media(max-width:600px){.modes{grid-template-columns:minmax(0,1fr)}.mode{min-height:0}#setDuel{grid-template-columns:minmax(0,1fr)}.pads.two{grid-template-columns:minmax(0,1fr)}.pad h4 small{display:none}}
@media(max-width:600px){.answers{grid-template-columns:minmax(0,1fr)}.diffs{grid-template-columns:minmax(0,1fr)}.diff{min-height:0}.hud{gap:12px}.logo{font-size:26px}.go{width:100%}}
@media(prefers-reduced-motion:reduce){.spin,.eq i{animation:none}}

/* ---------- affichages par mode ---------- */
.timer{position:absolute;right:-6px;top:-6px;z-index:2;min-width:48px;height:48px;border-radius:24px;display:grid;place-items:center;background:var(--vin);color:var(--kc,var(--acc));font:400 24px Anton,sans-serif;box-shadow:0 0 0 3px var(--acc)}
.timer:empty{display:none}
.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.duo .vs{font:400 34px/1 Anton,sans-serif;padding-bottom:6px;color:var(--acc)}
.duo label.red{color:#ff6b75}.duo label.blue{color:#7ba3ff}
.hint{margin:-2px 0 0;font-size:14px;color:var(--cmuted)}
body[data-game=duel] h1{font-style:italic;letter-spacing:.01em}
body[data-game=duel] h1::after{content:"";display:block;height:8px;margin-top:14px;max-width:420px;background:linear-gradient(90deg,#e63946 0 50%,#2f6bff 50%);border-radius:4px}
body[data-game=party] h1{font-size:clamp(72px,17vw,170px);background:linear-gradient(100deg,#ff3d9a,#ffd23f 45%,#27e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,61,154,.35))}
body[data-game=party] .lead{font-size:20px;font-weight:600}
.disco{display:none;width:30px;height:30px;border-radius:50%;margin-left:6px;background:repeating-conic-gradient(from 0deg,#fff 0 10deg,#b9b9d6 10deg 20deg,#ffd23f 20deg 26deg,#8f8fb3 26deg 36deg),radial-gradient(circle at 30% 30%,#fff,#777 70%);background-blend-mode:multiply;box-shadow:0 0 18px rgba(255,255,255,.6),0 0 40px rgba(255,61,154,.5);animation:spin 4s linear infinite}
body[data-game=party] .disco{display:inline-block}
.lights{position:fixed;inset:0;pointer-events:none;z-index:0;display:none;overflow:hidden}
body[data-game=party] .lights{display:block}
.lights i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(40px);opacity:.28;mix-blend-mode:screen;animation:drift 9s ease-in-out infinite alternate}
.lights i:nth-child(1){background:#ff3d9a;left:-20vmax;top:-20vmax}
.lights i:nth-child(2){background:#27e0ff;right:-25vmax;top:10vmax;animation-delay:-3s}
.lights i:nth-child(3){background:#9b5cff;left:10vmax;bottom:-35vmax;animation-delay:-6s}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
body[data-game=party][data-screen=game] .lights i{opacity:.4;animation-duration:4s}
.mode.m-party b{background:linear-gradient(100deg,#ff3d9a,#ffd23f 50%,#27e0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
/* pupitres du mode Babinski */
.pads.party .ro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.roc{display:flex;gap:10px;align-items:center;background:var(--card);color:var(--cardInk);border-radius:12px;padding:10px 12px;transition:background .2s,opacity .2s}
.roc .k{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--acc);color:#fff;font:400 18px Anton,sans-serif}
.roc b{display:block;line-height:1.2}.roc span span{font-size:14px;color:var(--cmuted)}
.roc.right{background:var(--ok);color:#fff}.roc.right span span{color:#fff}.roc.dim{opacity:.4}
.desks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:8px;margin-top:12px}
.desk{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;gap:8px;align-items:center;background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:14px;padding:8px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.dn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db{display:flex;gap:6px}
.ans.dk{width:48px;height:48px;min-height:0;padding:0;justify-content:center;font:400 22px Anton,sans-serif;border-radius:12px;background:var(--vin);color:var(--kc,var(--acc))}
.ans.dk.locked{background:var(--acc);color:#fff;opacity:1}
.ans.dk.right{background:var(--ok);color:#fff}.ans.dk.wrong{background:var(--ko);color:#fff}.ans.dk.dim{opacity:.35}
.ds{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.rank{list-style:none;padding:0;margin:14px auto 0;max-width:640px;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--card);color:var(--cardInk);border-radius:12px;padding:8px 12px}
.rank .rk{font:400 24px Anton,sans-serif;color:var(--cmuted)}.rank .nm b{display:block}.rank .nm small{color:var(--cmuted)}
.rank .pn{font:400 20px Anton,sans-serif;white-space:nowrap}
.rank li.win{box-shadow:inset 0 0 0 2px #ffd23f}.rank li.win .pn{color:#ffd23f}
.rank li.cs{box-shadow:inset 0 0 0 2px #ff3d9a}.rank li.cs .pn{color:#ff3d9a}
/* animation de fin de manche */
.fx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,2,20,.86);backdrop-filter:blur(6px);padding:20px;cursor:pointer;color:#fff}
.fx-card{text-align:center;max-width:560px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.fx-k{margin:0;font-weight:800;color:#c9b8ff;font-size:16px}
.fx-n{margin:4px 0;font:400 clamp(48px,12vw,96px)/1 Anton,sans-serif}
.fx-t{margin:0;font:400 clamp(30px,7vw,56px)/1.05 Anton,sans-serif;color:#ffd23f}
.fx-cs .fx-t{color:#ff3d9a;font-size:clamp(46px,12vw,92px);animation:shake .5s ease-in-out 3}
.fx-cs .fx-card{animation:pop .35s cubic-bezier(.2,1.4,.4,1),flash 1.2s ease-in-out 2}
@keyframes shake{25%{transform:translateX(-10px) rotate(-3deg)}75%{transform:translateX(10px) rotate(3deg)}}
@keyframes flash{50%{filter:drop-shadow(0 0 30px #ff3d9a)}}
.fx-none .fx-t{color:#27e0ff}
.fx-skip{margin-top:22px;font-size:14px;color:#b9a9d9}.fx-skip .btn{color:#fff;box-shadow:inset 0 0 0 2px #6d5a99;margin-left:6px}
.glass{width:120px;height:160px;display:block;margin:0 auto 12px}
.glass .liq,.glass .foam{transform-origin:50% 100%;transform-box:view-box;animation:drain 1.9s ease-in forwards .25s}
.glass.gcs{animation:tilt 2.6s ease-in-out forwards}
.glass.gcs .liq,.glass.gcs .foam{animation:drain 1.2s ease-in forwards .5s}
@keyframes drain{to{transform:scaleY(.08)}}
@keyframes tilt{30%{transform:rotate(-12deg)}60%{transform:rotate(-55deg) translateY(-10px)}100%{transform:rotate(-55deg) translateY(-10px)}}
.bub{animation:rise 1.4s ease-in infinite}.bub.b2{animation-delay:.4s}.bub.b3{animation-delay:.8s}
@keyframes rise{to{transform:translateY(-110px);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.fx-win .fx-t{color:#3dff9a}
@media(max-width:600px){.pads.party .ro{grid-template-columns:minmax(0,1fr)}.duo{grid-template-columns:minmax(0,1fr)}.duo .vs{text-align:center}.ans.dk{width:44px;height:44px}.desk{grid-template-columns:minmax(0,1fr) auto}.ds{grid-column:1/-1;text-align:left}}
@media(prefers-reduced-motion:reduce){.lights i,.disco,.glass,.glass *,.confetti i,.fx-t,.fx-card{animation:none!important}.glass .liq{transform:scaleY(.08)}}
</style>
</head>
<body>
<div class="bgword" id="bgword" aria-hidden="true">WORLD</div>
<div class="wrap">
  <header>
    <div class="logo"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>BLIND RUSH<span class="disco" aria-hidden="true"></span></div>
    <div class="hud hide" id="hud"></div>
  </header>

  <!-- ACCUEIL -->
  <section id="home">
    <h1 id="hero">Devine le son. Avant les autres.</h1>
    <p class="lead" id="lead">10 manches, 4 réponses. Plus tu réponds vite, plus tu marques.</p>
    <p class="dbinfo" id="dbinfo">Chargement de la base de musiques…</p>

    <h2>1. Mode de jeu</h2>

    <div class="setup" id="setup"></div>

    <h2>2. Ta playlist</h2>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabStyle" aria-selected="true">Par style</button>
      <button class="tab" role="tab" id="tabPick" aria-selected="false">Je choisis mes artistes</button>
    </div>
    <div class="panel" id="pStyle"><div class="chips" id="cats"></div></div>
    <div class="panel hide" id="pPick">
      <div class="searchbox"><input id="q" type="search" autocomplete="off" placeholder="Cherche un artiste : Jul, Angèle, Queen…" aria-label="Chercher un artiste"></div>
      <ul class="list" id="list"></ul>
      <div class="sel">
        <h3>Ta sélection <span id="selCount">0 artiste</span></h3>
        <div class="tags" id="tags"></div>
        <div class="selrow">
          <button class="btn y" id="validate">Valider la sélection</button>
          <button class="btn ghost" id="clearSel">Tout effacer</button>
          <span class="ok" id="validMsg" aria-live="polite"></span>
        </div>
      </div>
    </div>

    <h2>3. Difficulté</h2>
    <div class="diffs" id="diffs"></div>

    <div class="launch">
      <button class="go" id="goBtn">LANCER LA PARTIE</button>
      <p class="summary" id="summary"></p>
    </div>
    <div class="err hide" id="err" role="alert"></div>
    <p class="rules" id="rules"></p>
  </section>

  <!-- JEU -->
  <section id="game" class="hide">
    <div class="turn hide" id="turn"></div>
    <div class="stage">
      <div class="deck">
        <span class="timer" id="timer" aria-hidden="true"></span><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" id="ringFg" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
        <div class="vinyl" id="vinyl"><div class="label" id="label"><img id="cover" alt=""></div></div>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="pads" id="pads"></div>
    <div id="extra"></div>
    <div class="row">
      <button class="btn y hide" id="playBtn">▶ Lancer l'extrait</button>
      <button class="btn y hide" id="nextBtn">Manche suivante</button>
      <button class="btn alt" id="quitBtn">Quitter</button>
    </div>
  </section>

  <!-- RÉSULTATS -->
  <section id="results" class="hide">
    <p class="big" id="final">0</p>
    <p class="lead" id="verdict"></p>
    <ol class="board" id="board"></ol>
    <div class="row" style="justify-content:flex-start"><button class="btn y" id="againBtn">Rejouer</button><button class="btn alt" id="menuBtn">Changer de mode ou de playlist</button></div>
    <ul class="recap" id="recap"></ul>
  </section>
</div>
<div class="fx hide" id="fx" role="dialog" aria-live="assertive"></div>
<div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
<audio id="audio" preload="auto"></audio>

<script>
(async()=>{
let DB;
try{DB=await fetch('db.json').then(r=>{if(!r.ok)throw 0;return r.json()})}catch(e){document.querySelector('#dbinfo').textContent='Impossible de charger la base de musiques (db.json). Recharge la page.';return}
const $=s=>document.querySelector(s);
const ROUNDS=10;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rand=(a,b)=>a+Math.random()*(b-a);
const fmt=n=>n.toLocaleString('fr-FR');
const plural=(n,w)=>`${n} ${w}${n>1?'s':''}`;

/* ---------- base de données intégrée ---------- */
const ARTISTS=DB.a.map((n,i)=>({i,n,k:norm(n),tracks:[]}));
const TRACKS=DB.t.map(([ai,title,disp,id,md5,album])=>{
  const t={ai,title,artist:disp||DB.a[ai],id,album,cover:md5?`https://e-cdns-images.dzcdn.net/images/cover/${md5}/500x500-000000-80-0-0.jpg`:'',link:`https://www.deezer.com/track/${id}`,key:norm(title),url:'',exp:0};
  ARTISTS[ai].tracks.push(t);return t;
});
const CATS=[['mix','Mix monde',ARTISTS.map(a=>a.i)],...DB.c];
$('#dbinfo').textContent=`Base intégrée : ${fmt(TRACKS.length)} morceaux de ${fmt(ARTISTS.length)} artistes, du monde entier.`;

const DIFF={
  facile:{n:'Facile',d:'20 s pour répondre, début du morceau',limit:20,mult:1,off:[0,4]},
  moyen:{n:'Moyen',d:'14 s pour répondre, extrait dans le morceau',limit:14,mult:1.5,off:[2,12]},
  difficile:{n:'Difficile',d:'8 s pour répondre, extrait au hasard',limit:8,mult:2,off:[4,20]}
};
const store={get(k,d){try{const v=localStorage.getItem('br-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('br-'+k,JSON.stringify(v))}catch(e){}}};
const S=window.S={game:store.get('game','solo'),duel:store.get('duel',['','']),party:store.get('party',[]),soft:store.get('soft',false),opt:Object.assign({solo:{n:10},duel:{n:10,malus:true},party:{n:10,int:'destroy',cards:true}},store.get('opt',{})),mode:'style',cat:'mix',diff:store.get('diff','moyen'),pick:store.get('pick',[]),valid:store.get('valid',[]),rounds:[],i:0,score:0,streak:0,phase:'idle',t0:0,raf:0,fails:0};
S.pick=S.pick.filter(i=>ARTISTS[i]);S.valid=S.valid.filter(i=>ARTISTS[i]);
if(S.valid.length)S.mode='pick';
const audio=$('#audio');


/* ---------- ambiances par style ---------- */
const THEMES={
 duel:{n:'Ambiance ring de boxe',bg:'#15151c',ink:'#f4f4f6',card:'#24242f',cardInk:'#f4f4f6',acc:'#ffcc33',vin:'#08080c',vinInk:'#f4f4f6',pat:'linear-gradient(115deg,rgba(230,57,70,.28) 0 50%,rgba(47,107,255,.28) 50% 100%)',w:'DUEL'},
 party:{n:'Ambiance soirée',bg:'#14072a',ink:'#fff3fb',card:'#26113f',cardInk:'#fff3fb',acc:'#ff3d9a',goInk:'#fff',kc:'#ffd23f',vin:'#0a0316',vinInk:'#fff3fb',pat:'radial-gradient(circle at 12% 8%,rgba(255,61,154,.38),transparent 32%),radial-gradient(circle at 88% 14%,rgba(39,224,255,.3),transparent 30%),radial-gradient(circle at 50% 105%,rgba(255,210,63,.28),transparent 42%),radial-gradient(rgba(255,255,255,.45) 1px,transparent 1.6px) 0 0/30px 30px',w:'BABINSKI'},
 mix:{n:'Ambiance tour du monde',bg:'#ff5b35',ink:'#1d0c07',card:'#fff4ea',cardInk:'#1d0c07',acc:'#ffd23f',vin:'#1d0c07',vinInk:'#fff1e6',pat:'none',w:'WORLD'},
 rapfr:{n:'Ambiance béton',bg:'#26262b',ink:'#f2f2f2',card:'#3a3a42',cardInk:'#f2f2f2',acc:'#3d8bff',goInk:'#fff',vin:'#0f0f12',vinInk:'#f2f2f2',pat:'repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px)',w:'RAP FR'},
 rapus:{n:'Ambiance or et nuit',bg:'#121212',ink:'#f5efe0',card:'#26221a',cardInk:'#f5efe0',acc:'#e8b838',vin:'#000',vinInk:'#f5efe0',pat:'radial-gradient(circle at 85% 8%,rgba(232,184,56,.22),transparent 45%)',w:'HIP-HOP'},
 variete:{n:'Ambiance bal populaire',bg:'#1f2d63',ink:'#fff8ef',card:'#fff8ef',cardInk:'#1f2d63',acc:'#ef3b4a',goInk:'#fff',vin:'#141d42',vinInk:'#fff8ef',pat:'linear-gradient(90deg,transparent 0 94%,rgba(255,255,255,.22) 94% 97%,rgba(239,59,74,.55) 97%)',w:'CHANSON'},
 pop:{n:'Ambiance chewing-gum',bg:'#ff7ac0',ink:'#2a0a1f',card:'#fff0f8',cardInk:'#2a0a1f',acc:'#fff15c',vin:'#2a0a1f',vinInk:'#fff0f8',pat:'radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.5px) 0 0/22px 22px',w:'POP'},
 rock:{n:'Ambiance ampli à fond',bg:'#180707',ink:'#f6e9e4',card:'#2f1111',cardInk:'#f6e9e4',acc:'#e3261b',goInk:'#fff',vin:'#000',vinInk:'#f6e9e4',pat:'radial-gradient(circle at 50% 115%,rgba(227,38,27,.4),transparent 60%)',w:'ROCK'},
 y70:{n:'Ambiance boule à facettes',bg:'#e3a528',ink:'#3a1d0c',card:'#fff3d6',cardInk:'#3a1d0c',acc:'#d9531e',goInk:'#fff',vin:'#3a1d0c',vinInk:'#fff3d6',pat:'repeating-radial-gradient(circle at 50% 115%,transparent 0 46px,rgba(217,83,30,.2) 46px 80px)',w:'DISCO'},
 y80:{n:'Ambiance synthwave',bg:'#24104f',ink:'#ffe9fb',card:'#3a1a73',cardInk:'#ffe9fb',acc:'#ff3fa4',goInk:'#fff',vin:'#12062b',vinInk:'#ffe9fb',pat:'linear-gradient(rgba(39,224,255,.16) 1px,transparent 1px) 0 0/100% 34px,linear-gradient(90deg,rgba(39,224,255,.16) 1px,transparent 1px) 0 0/34px 100%',w:'1980'},
 y90:{n:'Ambiance Memphis',bg:'#19b5a5',ink:'#1d1036',card:'#fdfaf0',cardInk:'#1d1036',acc:'#ffde33',vin:'#1d1036',vinInk:'#fdfaf0',pat:'repeating-linear-gradient(45deg,transparent 0 30px,rgba(29,16,54,.08) 30px 33px)',w:'1990'},
 y2000:{n:'Ambiance Y2K',bg:'#a9d8ff',ink:'#0b1d3a',card:'#f4fbff',cardInk:'#0b1d3a',acc:'#ff2fa0',goInk:'#fff',vin:'#0b1d3a',vinInk:'#f4fbff',pat:'linear-gradient(160deg,rgba(255,255,255,.65),transparent 40%,rgba(255,255,255,.35) 60%,transparent)',w:'2000'},
 electro:{n:'Ambiance club',bg:'#0a0f2e',ink:'#e8f7ff',card:'#17214f',cardInk:'#e8f7ff',acc:'#27e0ff',vin:'#03061a',vinInk:'#e8f7ff',pat:'radial-gradient(ellipse at 15% 0%,rgba(39,224,255,.25),transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(160,60,255,.28),transparent 50%)',w:'ELECTRO'},
 latino:{n:'Ambiance plein soleil',bg:'#ffb100',ink:'#4a0d2a',card:'#fff6e0',cardInk:'#4a0d2a',acc:'#e4007c',goInk:'#fff',vin:'#4a0d2a',vinInk:'#fff6e0',pat:'radial-gradient(circle at 88% 12%,rgba(255,255,255,.5) 0 70px,transparent 71px)',w:'LATINO'},
 afro:{n:'Ambiance terre et or',bg:'#b8471f',ink:'#fff4e2',card:'#fff4e2',cardInk:'#3b1406',acc:'#ffc93c',vin:'#3b1406',vinInk:'#fff4e2',pat:'repeating-linear-gradient(90deg,rgba(255,201,60,.13) 0 14px,transparent 14px 28px,rgba(0,0,0,.09) 28px 34px,transparent 34px 60px)',w:'AFRO'},
 kpop:{n:'Ambiance idol',bg:'#cbb8ff',ink:'#24124a',card:'#fbf8ff',cardInk:'#24124a',acc:'#ff4f9a',goInk:'#fff',vin:'#24124a',vinInk:'#fbf8ff',pat:'radial-gradient(circle at 10% 20%,rgba(255,79,154,.28),transparent 30%),radial-gradient(circle at 90% 80%,rgba(255,255,255,.55),transparent 35%)',w:'K-POP'},
 rnb:{n:'Ambiance velours',bg:'#4a0e2e',ink:'#fde8e1',card:'#661a40',cardInk:'#fde8e1',acc:'#f2b6a0',vin:'#25051a',vinInk:'#fde8e1',pat:'radial-gradient(ellipse at 50% 0%,rgba(242,182,160,.22),transparent 60%)',w:'SOUL'},
 reggae:{n:'Ambiance roots',bg:'#13723a',ink:'#fffbe8',card:'#fffbe8',cardInk:'#0d3b1f',acc:'#ffd400',vin:'#0d3b1f',vinInk:'#fffbe8',pat:'linear-gradient(transparent 0 93%,#e31b23 93% 95.5%,#ffd400 95.5% 98%,transparent 98%)',w:'REGGAE'},
 jazz:{n:'Ambiance club de jazz',bg:'#101a2c',ink:'#f3ead8',card:'#1e2b44',cardInk:'#f3ead8',acc:'#d4a24c',vin:'#060b16',vinInk:'#f3ead8',pat:'radial-gradient(circle at 72% 28%,rgba(212,162,76,.18),transparent 40%)',w:'JAZZ'},
 country:{n:'Ambiance saloon',bg:'#7a4a2c',ink:'#fbf1e2',card:'#fbf1e2',cardInk:'#3d2212',acc:'#f2c14e',vin:'#3d2212',vinInk:'#fbf1e2',pat:'repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 3px,transparent 3px 26px)',w:'COUNTRY'}
};
function applyTheme(k){
  const t=THEMES[k]||THEMES.mix,r=document.documentElement.style;
  for(const v of ['bg','ink','card','cardInk','acc','vin','vinInk','pat'])r.setProperty('--'+v,t[v]);
  r.setProperty('--goInk',t.goInk||'#1d0c07');r.setProperty('--kc',t.kc||t.acc);
  $('#bgword').textContent=t.w;$('#mood').textContent=t.n;
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.bg;
}
function themeKey(){
  if(S.game==='duel'||S.game==='party')return S.game;
  if(S.mode==='style')return S.cat;
  const ids=S.valid.length?S.valid:S.pick;if(!ids.length)return 'mix';
  let best='mix',n=0;for(const [k,,m] of CATS){if(k==='mix')continue;const c=ids.filter(i=>m.includes(i)).length;if(c>n){n=c;best=k}}
  return best;
}

/* ---------- accueil ---------- */
function setMode(m){S.mode=m;$('#tabStyle').setAttribute('aria-selected',m==='style');$('#tabPick').setAttribute('aria-selected',m==='pick');$('#pStyle').classList.toggle('hide',m!=='style');$('#pPick').classList.toggle('hide',m!=='pick');summary()}
$('#tabStyle').addEventListener('click',()=>setMode('style'));
$('#tabPick').addEventListener('click',()=>{setMode('pick');$('#q').focus()});
function renderCats(){$('#cats').innerHTML=CATS.map(([k,n,ids])=>{const t=THEMES[k]||THEMES.mix;return `<button class="chip" data-c="${k}" style="--cb:${t.bg};--ci:${t.ink}" aria-pressed="${S.cat===k}">${esc(n)}<small>${ids.length}</small></button>`}).join('')}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;S.cat=b.dataset.c;renderCats();summary()});
function renderDiffs(){$('#diffs').innerHTML=Object.entries(DIFF).map(([k,d])=>`<button class="diff" data-d="${k}" aria-pressed="${S.diff===k}"><b>${d.n}</b><span>${d.d}</span></button>`).join('')}
$('#diffs').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;S.diff=b.dataset.d;store.set('diff',S.diff);renderDiffs();summary()});

function renderList(){
  const q=norm($('#q').value);
  let res=q?ARTISTS.filter(a=>a.k.includes(q)).sort((a,b)=>(b.k.startsWith(q)-a.k.startsWith(q))||a.n.localeCompare(b.n,'fr')):[...ARTISTS].sort((a,b)=>a.n.localeCompare(b.n,'fr'));
  const n=res.length;res=res.slice(0,60);
  $('#list').innerHTML=res.length?res.map(a=>`<li><button data-a="${a.i}" class="${S.pick.includes(a.i)?'on':''}">${esc(a.n)}<span>${plural(a.tracks.length,'titre')}</span></button></li>`).join('')+(n>60?`<li class="none">… et ${n-60} autres, affine ta recherche</li>`:''):`<li class="none">Aucun artiste « ${esc($('#q').value)} » dans la base.</li>`;
}
function renderSel(){
  $('#selCount').textContent=`${plural(S.pick.length,'artiste')} · ${plural(S.pick.reduce((s,i)=>s+ARTISTS[i].tracks.length,0),'titre')}`;
  $('#tags').innerHTML=S.pick.length?S.pick.map(i=>`<span class="tag">${esc(ARTISTS[i].n)}<button data-rm="${i}" aria-label="Retirer ${esc(ARTISTS[i].n)}">×</button></span>`).join(''):'<span class="empty">Clique sur des artistes dans la liste pour les ajouter.</span>';
  const same=S.valid.length&&S.valid.length===S.pick.length&&S.valid.every(i=>S.pick.includes(i));
  $('#validMsg').textContent=same?'Prête à jouer':'';
  $('#validate').textContent=same?'Sélection validée ✓':'Valider la sélection';
  store.set('pick',S.pick);
}
function toggleArtist(i){S.pick=S.pick.includes(i)?S.pick.filter(x=>x!==i):[...S.pick,i];renderList();renderSel();summary()}
$('#q').addEventListener('input',renderList);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const b=$('#list button');if(b){toggleArtist(+b.dataset.a);$('#q').select()}}});
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)toggleArtist(+b.dataset.a)});
$('#tags').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b)toggleArtist(+b.dataset.rm)});
$('#clearSel').addEventListener('click',()=>{S.pick=[];S.valid=[];store.set('valid',[]);renderList();renderSel();summary()});
$('#validate').addEventListener('click',()=>{
  const n=S.pick.reduce((s,i)=>s+ARTISTS[i].tracks.length,0);
  if(!S.pick.length)return showErr('Ajoute au moins un artiste avant de valider.');
  if(n<ROUNDS)return showErr(`Ta sélection n'a que ${plural(n,'titre')}. Il en faut au moins ${ROUNDS} : ajoute un ou deux artistes.`);
  hideErr();S.valid=[...S.pick];store.set('valid',S.valid);renderSel();summary();$('#goBtn').focus();
});
function playlist(){
  if(S.mode==='pick')return S.valid.length?{ids:S.valid,name:S.valid.length<=3?S.valid.map(i=>ARTISTS[i].n).join(', '):`Ta sélection (${S.valid.length} artistes)`}:null;
  const c=CATS.find(c=>c[0]===S.cat);return {ids:c[2],name:c[1]};
}
function summary(){
  applyTheme(themeKey());
  const p=playlist(),el=$('#summary');
  if(!p){el.innerHTML='Valide d\'abord ta sélection d\'artistes.<small>Ou repasse sur « Par style ».</small>';return}
  el.innerHTML=`${esc(GAMES[S.game].n)} · ${esc(p.name)} · ${DIFF[S.diff].n}<small>${plural(p.ids.reduce((s,i)=>s+ARTISTS[i].tracks.length,0),'titre')} possibles</small>`;
}
function showErr(m){const e=$('#err');e.textContent=m;e.classList.remove('hide')}
function hideErr(){$('#err').classList.add('hide')}

/* ---------- tirage des manches (hors ligne, depuis la base) ---------- */
function buildRounds(ids,n){
  const groups=shuffle(ids.map(i=>ARTISTS[i].tracks).filter(g=>g.length));
  const pool=groups.flat();
  // chaque artiste donne d'abord ses titres les plus connus
  const queues=groups.map(g=>[...shuffle(g.slice(0,6)),...shuffle(g.slice(6))]);
  const answers=[],used=new Set();
  while(answers.length<n&&queues.some(q=>q.length)){
    for(const q of queues){if(answers.length>=n)break;while(q.length){const t=q.shift();if(!used.has(t)){used.add(t);answers.push(t);break}}}
  }
  return {pool,rounds:answers.map(ans=>({ans,choices:makeChoices(ans,pool)}))};
}
function makeChoices(ans,pool){
  const others=shuffle(pool.filter(t=>t.key!==ans.key));
  const pick=[];for(const t of [...others.filter(t=>t.ai!==ans.ai),...others])if(pick.length<3&&!pick.some(p=>p.key===t.key))pick.push(t);
  return shuffle([ans,...pick]);
}

function loadSrc(url){
  return new Promise(res=>{
    const end=v=>{clearTimeout(t);audio.removeEventListener('loadedmetadata',ok);audio.removeEventListener('error',ko);res(v)};
    const ok=()=>end(true),ko=()=>end(false),t=setTimeout(()=>end(audio.readyState>0),8000);
    audio.addEventListener('loadedmetadata',ok);audio.addEventListener('error',ko);
    audio.pause();audio.src=url;audio.load();
  });
}
function jsonp(url,ms=7000){return new Promise((res,rej)=>{const cb='br'+Math.random().toString(36).slice(2),s=document.createElement('script');const done=()=>{clearTimeout(t);window[cb]=()=>{};s.remove()};const t=setTimeout(()=>{done();rej()},ms);window[cb]=d=>{done();res(d)};s.onerror=()=>{done();rej()};s.src=url+'&callback='+cb;document.head.appendChild(s)})}
/* l'extrait audio est demandé au moment de jouer (Deezer, sinon Apple Music en secours) */
async function resolveUrl(t,skipDeezer){
  if(!skipDeezer&&t.url&&t.exp>Date.now()/1000+120)return t.url;
  if(!skipDeezer)try{const d=await jsonp(`https://api.deezer.com/track/${t.id}?output=jsonp`);if(d&&d.preview){t.url=d.preview;const m=/exp=(\d+)/.exec(d.preview);t.exp=m?+m[1]:Date.now()/1000+600;return t.url}}catch(e){}
  try{const d=await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(DB.a[t.ai]+' '+t.title)}&entity=song&limit=5&country=FR`);const r=(d.results||[]).find(r=>r.previewUrl&&norm(r.trackName).includes(t.key.slice(0,12)))||(d.results||[]).find(r=>r.previewUrl);if(r){t.url=r.previewUrl;t.exp=Date.now()/1000+86400;return t.url}}catch(e){}
  return '';
}
async function playClip(r){
  S.phase='loading';
  let url=await resolveUrl(r.ans),ok=url?await loadSrc(url):false;
  if(!ok){url=await resolveUrl(r.ans,true);ok=url?await loadSrc(url):false}
  if(!ok){
    S.fails++;
    if(S.fails>=3&&S.fails>=S.i+3){S.phase='dead';$('#status').innerHTML='Le son ne passe pas.<small>Vérifie ta connexion internet, puis recharge la page.</small>';return}
    const used=new Set(S.rounds.map(x=>x.ans));const alt=shuffle(S.pool).find(t=>!used.has(t));
    if(alt){r.ans=alt;r.choices=makeChoices(alt,S.pool);$('#cover').src=alt.cover||'';renderPads(r);return playClip(r)}
  }
  // la musique tourne pendant tout le chrono : on choisit un départ qui laisse assez de morceau
  const dur=isFinite(audio.duration)&&audio.duration>0?audio.duration:30;
  r.off=Math.max(0,Math.min(rand(...DIFF[S.diff].off),dur-r.limit-.5));
  try{audio.currentTime=r.off}catch(e){r.off=0}
  try{await audio.play()}catch(e){
    S.phase='blocked';$('#status').innerHTML='Ton navigateur attend un clic pour jouer le son.<small>Appuie sur « Lancer l\'extrait ».</small>';$('#playBtn').classList.remove('hide');return;
  }
  $('#playBtn').classList.add('hide');
  S.phase='guess';S.t0=performance.now();
  for(const b of document.querySelectorAll('.ans'))b.disabled=false;
  $('#vinyl').classList.add('spin');
  $('#status').innerHTML=S.game==='party'?'Tout le monde répond !<small>Chacun tape sa lettre sur sa ligne.</small>':r.pads.length>1?'Écoutez bien…<small>Chacun répond sur son côté.</small>':'Écoute bien…<small>Qui chante ? Quel titre ?</small>';
  cancelAnimationFrame(S.raf);S.raf=requestAnimationFrame(tick);
}
$('#playBtn').addEventListener('click',()=>playClip(S.rounds[S.i]));
function setRing(p){const fg=$('#ringFg');fg.setAttribute('stroke-dashoffset',String(Math.min(100,p*100)));fg.style.stroke=p>.75?'#c81e1e':''}
function tick(){
  if(S.phase!=='guess')return;
  const r=S.rounds[S.i],el=(performance.now()-S.t0)/1000;
  setRing(el/r.limit);$('#timer').textContent=Math.max(0,Math.ceil(r.limit-el));
  if(audio.paused&&!audio.ended)audio.play().catch(()=>{});
  if(el>=r.limit)return reveal();

}
function pick(k,i){
  if(S.phase!=='guess')return;
  const pad=S.pad[k];if(!pad||pad.choice!==null)return;
  pad.choice=i;pad.t=(performance.now()-S.t0)/1000;

  else{const left=S.pad.filter(p=>p.choice===null).length;$('#status').innerHTML=`Tout le monde répond !<small>Encore ${plural(left,'joueur')} à répondre.</small>`}
}
const fmtT=t=>t.toFixed(1).replace('.',',')+' s';
function reveal(){
  if(S.phase!=='guess')return;
  S.phase='reveal';cancelAnimationFrame(S.raf);$('#timer').textContent='';
  const r=S.rounds[S.i],D=DIFF[S.diff];
  const ok=S.pad.map(p=>p.choice!==null&&r.choices[p.choice]===r.ans);
  S.pad.forEach((p,k)=>document.querySelectorAll(`.ans[data-pad="${k}"]`).forEach((b,i)=>{b.disabled=true;b.classList.remove('locked');b.classList.add(r.choices[i]===r.ans?'right':i===p.choice?'wrong':'dim')}));
  if(S.game==='party')document.querySelectorAll('.roc').forEach((c,i)=>c.classList.add(r.choices[i]===r.ans?'right':'dim'));
  $('#label').classList.add('show');
  const what=`${esc(r.ans.title)} — ${esc(r.ans.artist)}`;
  r.res=S.pad.map((p,k)=>({p:p.p,ok:ok[k],t:p.t,choice:p.choice,pts:0}));
  let html='';
  if(S.game==='solo'){
    const pl=S.pl[0],x=r.res[0];
    if(x.ok){pl.streak++;pl.good++;x.pts=Math.round((300+700*Math.max(0,1-x.t/r.limit))*D.mult)+(pl.streak>=2?50*(pl.streak-1):0)}else pl.streak=0;
    pl.score+=x.pts;
    html=x.ok?`<span class="pop">+${fmt(x.pts)} pts</span><small>Répondu en ${fmtT(x.t)}${pl.streak>=2?` · série de ${pl.streak}`:''}</small>`:x.t==null?`Temps écoulé !<small>C'était ${what}</small>`:`Raté !<small>C'était ${what}</small>`;
  }
  if(S.game==='duel'){
    const firsts=r.res.filter(x=>x.ok).sort((a,b)=>a.t-b.t);
    for(const x of r.res){
      const pl=S.pl[x.p];
      if(x.ok){pl.good++;x.pts=Math.round((300+700*Math.max(0,1-x.t/r.limit))*D.mult)+(firsts[0]===x?150:0)}
      else if(x.t!=null&&opt().malus)x.pts=-Math.round(150*D.mult);
      pl.score+=x.pts;
    }
    html=`<span class="duelres">${r.res.map((x,k)=>`<span class="pc${k}">${esc(S.pl[x.p].name)} ${x.pts>0?'+':''}${fmt(x.pts)}</span>`).join('')}</span><small>C'était ${what}</small>`;
  }
  $('#status').innerHTML=html;
  hud();
  const nb=$('#nextBtn');nb.textContent=S.i<S.n-1?'Manche suivante':'Voir les résultats';
  if(S.game==='party'){partyRound(r,what);return}
  nb.classList.remove('hide');nb.focus();
}

/* ---------- mode Babinski (« Là pour se détruire ») ---------- */
function partyRound(r,what){
  const I=INT[opt().int],n=S.pl.length,st=r.stake;
  const order=[...r.res].sort((a,b)=>(b.ok-a.ok)||((a.t==null)-(b.t==null))||((a.t??99)-(b.t??99)));
  const anyOk=order.some(x=>x.ok);
  r.pen=order.map((x,i)=>{
    let sips=0,cs=false;
    if(!anyOk){sips=r.card==='tournee'?3:2}
    else if(i===0){sips=0}
    else if(i===n-1){if(I.cs)cs=true;else sips=I.max}
    else{sips=1+Math.round((i-1)*(I.mid-1)/Math.max(1,n-3));if(!x.ok)sips=Math.max(2,sips)}
    if(!cs&&sips)sips=Math.min(sips*st,10);
    return {p:x.p,rank:i+1,ok:x.ok,t:x.t,choice:x.choice,sips,cs,joker:false};
  });
  for(const e of r.pen){const pl=S.pl[e.p];pl.drunk+=e.sips;if(e.cs)pl.cs++;if(e.ok)pl.good++}
  S.toGive=0;S.vote=false;S.giver=r.pen[0].p;
  if(anyOk){S.pl[S.giver].wins++;if(r.card==='roi')S.toGive=3;if(r.card==='karaoke')S.vote=true}
  r.log={anyOk};
  $('#status').innerHTML=(anyOk?`${esc(S.pl[S.giver].name)} est le plus rapide !`:'Personne n\'a trouvé.')+`<small>C'était ${what}</small>`;
  hud();
  playFx(r,()=>{renderExtra(r);const nb=$('#nextBtn');nb.classList.remove('hide');if(!S.toGive&&!S.vote)nb.focus()});
}
function penText(e){return e.cs?CS():e.sips?unit(e.sips):'rien'}
function renderExtra(r){
  const rows=r.pen.map(e=>{const pl=S.pl[e.p];const how=e.ok?fmtT(e.t):e.choice!=null?`faux (${LET[e.choice]})`:'pas répondu';
    return `<li class="${e.rank===1&&r.log.anyOk?'win':''} ${e.cs?'cs':''}"><span class="rk">${e.rank}</span><span class="nm"><b>${esc(pl.name)}</b><small>${how}</small></span><span class="pn">${e.joker?'verre d\'eau':esc(penText(e))}</span>${(e.sips||e.cs)&&!e.joker&&pl.joker?`<button class="btn ghost sm" data-joker="${e.p}">Joker eau</button>`:'<span></span>'}</li>`}).join('');
  let h=`<ol class="rank">${rows}</ol>`;
  if(S.toGive>0)h+=`<div class="givebox"><p>${esc(S.pl[S.giver].name)} distribue : encore <b>${unit(S.toGive)}</b>. Tape sur les joueurs.</p><div class="chips">${S.pl.map((p,i)=>i===S.giver?'':`<button class="chip" data-give="${i}">${esc(p.name)}</button>`).join('')}</div></div>`;
  if(S.vote)h+=`<div class="givebox"><p>${esc(S.pl[S.giver].name)} chante le refrain. Le groupe juge :</p><div class="row"><button class="btn y" data-vote="1">Refrain réussi</button><button class="btn" data-vote="0">Refrain raté</button></div></div>`;
  $('#extra').innerHTML=h;
}
$('#extra').addEventListener('click',e=>{
  const r=S.rounds[S.i];if(!r||!r.pen)return;
  const g=e.target.closest('[data-give]');
  if(g&&S.toGive>0){const i=+g.dataset.give;S.pl[i].drunk++;S.pl[S.giver].given++;const en=r.pen.find(x=>x.p===i);if(en&&!en.cs)en.sips++;S.toGive--;renderExtra(r);hud();if(!S.toGive)$('#nextBtn').focus();return}
  const j=e.target.closest('[data-joker]');
  if(j){const p=+j.dataset.joker,en=r.pen.find(x=>x.p===p),pl=S.pl[p];if(!en||!pl.joker)return;pl.joker=false;en.joker=true;pl.drunk-=en.sips;if(en.cs)pl.cs--;renderExtra(r);hud();return}
  const v=e.target.closest('[data-vote]');
  if(v&&S.vote){S.vote=false;const me=S.giver,en=r.pen.find(x=>x.p===me);if(v.dataset.vote==='1')S.toGive=2;else{S.pl[me].drunk+=2;en.sips+=2}renderExtra(r);hud()}
});
/* animation de fin de manche : le premier, puis chaque joueur qui boit */
function glass(cs){return `<svg class="glass${cs?' gcs':''}" viewBox="0 0 120 160" aria-hidden="true"><defs><clipPath id="gc"><path d="M22 18h76l-10 126a8 8 0 0 1-8 7H40a8 8 0 0 1-8-7z"/></clipPath></defs><g clip-path="url(#gc)"><rect class="liq" x="0" y="30" width="120" height="130" fill="#ffb627"/><rect class="foam" x="0" y="22" width="120" height="14" fill="#fff6e0"/><circle class="bub b1" cx="45" cy="140" r="4" fill="#fff6"/><circle class="bub b2" cx="70" cy="150" r="3" fill="#fff6"/><circle class="bub b3" cx="58" cy="145" r="5" fill="#fff5"/></g><path d="M22 18h76l-10 126a8 8 0 0 1-8 7H40a8 8 0 0 1-8-7z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>`}
function confetti(){let h='';const c=['#ff3d9a','#27e0ff','#ffd23f','#9b5cff','#3dff9a'];for(let i=0;i<46;i++)h+=`<i style="left:${Math.random()*100}%;background:${c[i%5]};animation-delay:${(Math.random()*.6).toFixed(2)}s;animation-duration:${(1.4+Math.random()*1.2).toFixed(2)}s;transform:rotate(${Math.random()*360|0}deg)"></i>`;return `<div class="confetti">${h}</div>`}
function playFx(r,done){
  const fx=$('#fx'),steps=[];
  const first=r.pen[0];
  if(r.log.anyOk)steps.push({cls:'fx-win',html:`${confetti()}<p class="fx-k">Premier en ${fmtT(first.t)}</p><p class="fx-n">${esc(S.pl[first.p].name)}</p><p class="fx-t">ne boit rien</p>`});
  else steps.push({cls:'fx-none',html:`<p class="fx-k">Personne n'a trouvé</p><p class="fx-n">Tout le monde boit</p><p class="fx-t">${esc(unit(r.pen[0].sips))}</p>`});
  if(r.log.anyOk)for(const e of [...r.pen].filter(e=>e.sips||e.cs).sort((a,b)=>(a.cs-b.cs)||(a.sips-b.sips)))
    steps.push({cls:e.cs?'fx-cs':'fx-drink',html:`${glass(e.cs)}<p class="fx-k">${e.rank}<sup>e</sup> · ${e.ok?fmtT(e.t):e.choice!=null?'mauvaise réponse':'pas de réponse'}</p><p class="fx-n">${esc(S.pl[e.p].name)}</p><p class="fx-t">${e.cs?(S.soft?'20 pompes !':'CUL SEC !'):'boit '+esc(unit(e.sips))}</p>`});
  let i=0,timer=0;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nextStep=()=>{clearTimeout(timer);if(i>=steps.length){fx.classList.add('hide');fx.onclick=null;done();return}const s=steps[i++];fx.className='fx '+s.cls;fx.innerHTML=`<div class="fx-card">${s.html}<p class="fx-skip">Touchez pour continuer · <button class="btn ghost sm" id="fxAll">Tout passer</button></p></div>`;timer=setTimeout(nextStep,reduce?1500:(s.cls==='fx-cs'?3200:2300))};
  fx.onclick=e=>{if(e.target.closest('#fxAll')){i=steps.length}nextStep()};
  nextStep();
}

$('#pads').addEventListener('click',e=>{const b=e.target.closest('.ans');if(b&&!b.disabled)pick(+b.dataset.pad,+b.dataset.i)});
function next(){if(S.phase!=='reveal')return;$('#vinyl').classList.remove('spin');if(S.i<S.n-1){S.i++;round()}else results()}
$('#nextBtn').addEventListener('click',next);
document.addEventListener('keydown',e=>{
  if($('#game').classList.contains('hide')||e.target.tagName==='INPUT'||S.game==='party')return;
  if(S.phase==='guess'){
    const c=e.code||'';let k=-1,i=-1;
    const m=/^(?:Digit|Numpad)([1-4])$/.exec(c);
    if(m){k=0;i=+m[1]-1}else if(KEYS2.includes(c)&&S.pad.length>1){k=1;i=KEYS2.indexOf(c)}
    else if('1234'.includes(e.key)&&e.key.length===1){k=0;i=+e.key-1}
    if(k>=0){e.preventDefault();pick(k,i)}
  }
  else if(S.phase==='reveal'&&(e.key==='Enter'||e.key===' ')&&document.activeElement===document.body){e.preventDefault();next()}
});
$('#quitBtn').addEventListener('click',()=>{S.phase='idle';cancelAnimationFrame(S.raf);audio.pause();$('#vinyl').classList.remove('spin');$('#fx').classList.add('hide');show('home')});

/* ---------- résultats ---------- */
function results(){
  S.phase='idle';audio.pause();show('results');
  const fin=$('#final'),ver=$('#verdict'),board=$('#board');board.innerHTML='';
  if(S.game==='solo'){
    const pl=S.pl[0],key=S.diff+'-'+S.n,best=store.get('best',{}),prev=best[key]||0;
    if(pl.score>prev){best[key]=pl.score;store.set('best',best)}
    fin.textContent=fmt(pl.score)+' pts';
    const g=pl.good,ratio=g/S.n,v=ratio===1?'Sans faute. Encyclopédie vivante.':ratio>=.8?'Très grosse oreille.':ratio>=.5?'Pas mal, encore un effort sur la vitesse.':ratio>=.3?'Il y a du potentiel. On remet ça ?':'Les bacs t\'ont eu cette fois. Revanche ?';
    ver.textContent=`${g}/${S.n} en ${DIFF[S.diff].n.toLowerCase()} · ${S.name}. ${v}${pl.score>prev&&prev?' Nouveau record !':prev&&pl.score<=prev?` Record : ${fmt(prev)} pts.`:''}`;
  }
  if(S.game==='duel'){
    const [a,b]=S.pl,w=a.score===b.score?null:(a.score>b.score?a:b);
    fin.textContent=w?`${w.name} gagne`:'Égalité';
    ver.textContent=`${a.name} ${fmt(a.score)} pts (${a.good}/${S.n}) contre ${b.name} ${fmt(b.score)} pts (${b.good}/${S.n}) · ${S.name}, ${DIFF[S.diff].n.toLowerCase()}.`;
    board.innerHTML=S.pl.map((p,i)=>`<li class="pc${i}"><b>${esc(p.name)}</b><span>${p.good}/${S.n} bonne${p.good>1?'s':''} réponse${p.good>1?'s':''}</span><em>${fmt(p.score)} pts</em></li>`).join('');
  }
  if(S.game==='party'){
    const w=p=>p.drunk+p.cs*8;
    const rk=[...S.pl].sort((a,b)=>w(a)-w(b)||b.wins-a.wins);
    const cs=[...S.pl].sort((a,b)=>b.cs-a.cs)[0],fast=[...S.pl].sort((a,b)=>b.wins-a.wins)[0];
    fin.textContent=`Plus sobre : ${rk[0].name}`;
    ver.textContent=`${fast.wins?`${fast.name} a été le plus rapide ${plural(fast.wins,'fois')}. `:''}${cs.cs?`${cs.name} remporte le titre de roi du ${S.soft?'gainage':'cul sec'} (${cs.cs}). `:''}Pensez à boire de l'eau, et personne ne prend le volant ce soir.`;
    board.innerHTML=rk.map(p=>`<li><b>${esc(p.name)}</b><span>${plural(p.wins,'manche gagnée')} · ${plural(p.good,'bonne réponse')}${p.joker?'':' · joker utilisé'}</span><em>${unit(p.drunk)}${p.cs?` + ${p.cs} ${S.soft?'× 20 pompes':'cul sec'}`:''}</em></li>`).join('');
  }
  $('#recap').innerHTML=S.rounds.map((r,i)=>{
    let side='';
    if(S.game==='solo'){const x=r.res&&r.res[0];side=`<span class="p">${x&&x.ok?'+'+x.pts:'0'}<small>${x&&x.t!=null?fmtT(x.t):'temps écoulé'}</small></span>`}
    if(S.game==='duel')side=`<span class="p duo">${(r.res||[]).map((x,k)=>`<i class="pc${k}">${x.pts>0?'+':''}${x.pts}</i>`).join('')}</span>`;
    if(S.game==='party')side=`<span class="p small">${r.pen?esc(r.pen.filter(e=>(e.sips||e.cs)&&!e.joker).map(e=>`${S.pl[e.p].name} ${e.cs?CS():e.sips}`).join(' · ')||'—'):'—'}<small>${r.card?esc(CARDS[r.card].n):r.pen&&r.log.anyOk?'1er : '+esc(S.pl[r.pen[0].p].name):'personne'}</small></span>`;
    const ok=r.res&&r.res.some(x=>x.ok);
    return `<li class="${ok?'':'no'}"><img src="${esc(r.ans.cover)}" alt=""><span><b>${i+1}. ${esc(r.ans.title)}</b><span>${esc(r.ans.artist)}${r.ans.link?` · <a href="${esc(r.ans.link)}" target="_blank" rel="noopener">Écouter sur Deezer</a>`:''}</span></span>${side}</li>`;
  }).join('');
}
$('#againBtn').addEventListener('click',start);
$('#menuBtn').addEventListener('click',()=>show('home'));
$('#goBtn').addEventListener('click',start);
renderGames();

renderCats();renderDiffs();renderList();renderSel();setMode(S.mode);
})();
</script>
