name: Publier Blind Rush

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reconstruire:
        description: "Reconstruire la base de musiques depuis Deezer (30 à 60 min)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Construire la base de musiques (si absente ou demandée)
        # aussi quand le message du commit contient [reconstruire]
        if: ${{ hashFiles('db.json') == '' || inputs.reconstruire || contains(github.event.head_commit.message, '[reconstruire]') }}
        run: |
          pip3 install requests
          cd tools
          python3 construire_base.py
          python3 agrandir_base.py
          python3 discographies.py
          python3 empaqueter_base.py
          cd ..
          git config user.name "blind-rush-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db.json
          git commit -m "Met à jour la base de musiques" || echo "Rien de nouveau"
          # quelqu'un a peut-être publié pendant la reconstruction : on se met à jour avant d'envoyer
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

      - name: Playlists à thème (si demandé ou après une reconstruction)
        # aussi quand le message du commit contient [playlists]
        if: ${{ inputs.reconstruire || contains(github.event.head_commit.message, '[reconstruire]') || contains(github.event.head_commit.message, '[playlists]') }}
        run: |
          pip3 install requests
          git pull --rebase origin main || true
          cd tools
          python3 playlists_theme.py
          cd ..
          git config user.name "blind-rush-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db.json
          git commit -m "Met à jour les playlists à thème" || echo "Rien de nouveau"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
